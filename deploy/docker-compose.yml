# SysCreditos — MongoDB local (espejo de la BD MongoDB de Dokploy)
# Las credenciales se cargan desde deploy/.env (NO versionado) — ver deploy/.env.example
services:
  mongo:
    image: mongo:7
    container_name: syscreditos-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--auth", "--bind_ip_all", "--port", "27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-syscreditos}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - "${MONGO_USERNAME}"
        - --password
        - "${MONGO_PASSWORD}"
        - --authenticationDatabase
        - admin
        - --eval
        - "db.runCommand({ ping: 1 }).ok"
      interval: 10s
      timeout: 5s
      retries: 20

  # Inicializa el replica-set de 1 nodo (requerido por las transacciones de Mongo).
  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - mongosh
      - --host
      - mongo
      - --username
      - "${MONGO_USERNAME}"
      - --password
      - "${MONGO_PASSWORD}"
      - --authenticationDatabase
      - admin
      - --eval
      - 'rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] })'

volumes:
  mongo-data:

